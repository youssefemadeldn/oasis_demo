<!-- @dsCard group="Colors" viewport="700x180" name="Status Badge Colors" subtitle="Claim/lead status vocabulary" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;flex-wrap:wrap;gap:10px;padding:16px;font-family:var(--font-body)">
<span style="background:var(--status-pending-bg);color:var(--status-pending-fg);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600">● Pending</span>
<span style="background:var(--status-closed-bg);color:var(--status-closed-fg);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600">● Closed</span>
<span style="background:var(--status-rejected-bg);color:var(--status-rejected-fg);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600">● Rejected</span>
<span style="background:var(--status-processing-bg);color:var(--status-processing-fg);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600">● Under Process</span>
<span style="background:var(--status-invoiced-bg);color:var(--status-invoiced-fg);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600">● Invoiced</span>
<span style="background:var(--status-cancelled-bg);color:var(--status-cancelled-fg);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600">● Cancelled</span>
</div>
