<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & Shadows" subtitle="Corner radius and elevation" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:14px;padding:16px;font-family:var(--font-body)">
<div style="width:70px;height:70px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)"></div>
<div style="width:70px;height:70px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div>
<div style="width:70px;height:70px;background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div>
<div style="width:70px;height:70px;background:var(--color-brand);border-radius:var(--radius-xl);box-shadow:var(--shadow-brand)"></div>
<div style="width:70px;height:70px;background:var(--gray-100);border-radius:var(--radius-pill)"></div>
</div>
