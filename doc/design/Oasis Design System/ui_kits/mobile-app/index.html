<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Oasis Mobile App</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--gray-100);display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:var(--font-body)}
.phone{width:375px;height:760px;background:#000;border-radius:44px;padding:12px;box-shadow:var(--shadow-lg)}
.screen{width:100%;height:100%;background:#fff;border-radius:32px;overflow:hidden;position:relative}
</style>
</head>
<body>
<div class="phone"><div class="screen" id="root"></div></div>
<script src="mockData.js"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="PoliciesScreen.jsx"></script>
<script type="text/babel" src="PolicyDetailScreen.jsx"></script>
<script type="text/babel" src="ClaimsScreen.jsx"></script>
<script type="text/babel" src="ClaimDetailScreen.jsx"></script>
<script type="text/babel" src="SubmitClaimScreen.jsx"></script>
<script type="text/babel" src="ProfileScreen.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('login');
  const [data, setData] = React.useState(null);
  const nav = (s, d) => { setScreen(s); setData(d || null); };
  const Screens = {
    login: () => <window.LoginScreen onLogin={() => nav('home')} />,
    home: () => <window.HomeScreen nav={nav} />,
    policies: () => <window.PoliciesScreen nav={nav} />,
    policyDetail: () => <window.PolicyDetailScreen nav={nav} data={data} />,
    claims: () => <window.ClaimsScreen nav={nav} />,
    claimDetail: () => <window.ClaimDetailScreen nav={nav} data={data} />,
    submitClaim: () => <window.SubmitClaimScreen nav={nav} />,
    profile: () => <window.ProfileScreen nav={nav} />,
  };
  const View = Screens[screen] || Screens.login;
  return <View />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
