<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="padding:20px;background:var(--surface-page)"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Switch } = window.OasisDesignSystem_6d12e0;
function Demo(){
  const [c, setC] = React.useState(true);
  const [s, setS] = React.useState(true);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:360}}>
      <Input label="Policy Number" placeholder="e.g. SL-RUH-MOT-2026-0044" />
      <Input label="National ID" error="This field is required" />
      <Select label="Class of Business" options={['Motor','Property / Fire','Marine','Medical']} />
      <Checkbox label="I agree to the Terms" checked={c} onChange={()=>setC(v=>!v)} />
      <Switch label="Push notifications" checked={s} onChange={()=>setS(v=>!v)} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
